name: Lint (ruff + black + isort)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: ruff
        run: poetry run ruff check .

      - name: black --check
        run: poetry run black --check --line-length 100 .

      - name: isort --check
        run: poetry run isort --check-only --profile black --line-length 100 .
