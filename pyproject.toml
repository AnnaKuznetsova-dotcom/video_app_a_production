[tool.poetry]
name = "video-app-production"
version = "2.0.0"
description = "Сервис персонального видео для элитной недвижимости — production-standards (poetry, pre-commit, линтеры, автотесты)"
authors = ["AnnaKuznetsova-dotcom"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# --- Runtime: backend (FastAPI) ---
# В монорепо-venv fastapi не пинов на 0.115 (как в backend/Dockerfile), т.к.
# streamlit тянет starlette >=0.46 — для запуска тестов берём совместимые версии.
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = "0.32.0" }
pydantic = ">=2.7,<3"

# --- Runtime: frontend (Streamlit) ---
streamlit = "1.62.0"
requests = ">=2.31.0"
plotly = ">=5.20"
pillow = ">=10.0"

# --- Runtime: ML-стек — зафиксирован под numpy<2 (для shap 0.45) ---
numpy = ">=1.24,<2.0"
pandas = ">=2.0,<2.3"
scikit-learn = "1.5.2"
shap = "0.45.0"
xgboost = "2.0.3"
joblib = ">=1.4.0"

# --- Runtime: Yandex Object Storage (S3) ---
boto3 = "1.36.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
black = ">=24.0"
isort = ">=5.13"
ruff = ">=0.6"
mypy = ">=1.10"
pre-commit = ">=3.7"

# ============================================================================
# Форматирование и линтинг
# ============================================================================

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "frontend/assets|tools/charts"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "analytics", "metrics", "ml_core", "video_core", "frontend_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["frontend/assets", "tools/charts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
# isort-правило I НЕ включено в ruff: сортировку импортов делает отдельный
# хук isort (в одну сторону, без конфликта правок).
# E501: длинные строки проверяет black; E402: осознанные импорты в entry-point приложений
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# В UI-файлах много строковых SQL/HTML-литералов и осознанно "ранний" импорт
"frontend/**" = ["E402", "E741"]
"tools/**" = ["E402"]
"tests/**" = ["E402"]
# backend/main.py: sys.path-подстраховка должна выполниться ДО импорта video_api
"backend/main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["frontend/assets", "tools/charts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "api: живые HTTP-тесты задеплоенного backend (нужна сеть)",
]
addopts = "-ra"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
